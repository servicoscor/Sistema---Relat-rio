<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema Relatório de Plantão</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
  <style>
    :root{--bg:#f6f4ef;--panel:#fff;--text:#202124;--muted:#67645e;--line:#d9d3c7;--accent:#0f766e;--accent-dark:#134e4a;--danger:#b42318;--soft:#e6f3f1;--shadow:0 12px 32px rgba(32,33,36,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}h1,h2,h3{margin-top:0;line-height:1.15}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel);color:var(--text);min-height:40px;padding:9px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}button:hover{border-color:var(--accent)}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.secondary{background:var(--soft);color:var(--accent-dark);border-color:#b7ddda}.danger{color:var(--danger)}.hidden{display:none!important}
    .login{min-height:100vh;display:grid;grid-template-columns:minmax(320px,.9fr) minmax(360px,1.1fr)}.login-visual{background:linear-gradient(135deg,rgba(15,118,110,.85),rgba(19,78,74,.95));background-size:cover;background-position:center}.login-panel{display:flex;align-items:center;padding:48px}.login-card{width:min(100%,560px)}
    .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 18px;background:rgba(246,244,239,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.brand{font-weight:800;margin-right:auto}.userbox{text-align:right;color:var(--muted);font-size:12px;margin-right:8px}.userbox strong{display:block;color:var(--text);font-size:13px}
    .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 72px}.section{border-top:2px solid var(--line);padding:22px 0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.field{margin-bottom:14px}label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:6px;min-height:40px;padding:9px 10px}textarea{min-height:72px;resize:vertical}.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.seg label{margin:0;padding:10px 12px;color:var(--text);cursor:pointer;letter-spacing:0;text-transform:none;font-size:14px;font-weight:600}.seg input{width:auto;min-height:auto;margin-right:6px}.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}.row input,.row textarea,.row select{flex:1}.hint,.error{font-size:13px;color:var(--muted)}.error{color:var(--danger)}.kicker{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}.report{max-width:940px;background:#fff;margin:28px auto 80px;padding:40px;box-shadow:var(--shadow)}.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 10px;margin:0 6px 6px 0;background:#fff;font-size:13px}table{width:100%;border-collapse:collapse;background:#fff}th,td{border-top:1px solid var(--line);padding:10px;text-align:left;vertical-align:top}th{color:var(--muted);font-size:12px;text-transform:uppercase}.metric{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px}.metric strong{display:block;font-size:30px;line-height:1}.metric span{display:block;margin-top:8px;color:var(--muted);font-size:12px;text-transform:uppercase}
    @media(max-width:820px){.login{grid-template-columns:1fr}.login-visual{min-height:180px}.login-panel{padding:28px 20px}.topbar{flex-wrap:wrap}.brand{width:100%}.grid2,.grid3,.grid5{grid-template-columns:1fr}.report{margin:0;padding:24px 20px;box-shadow:none}.row{flex-direction:column}.row button{width:100%}}
    .login-visual{display:flex;flex-direction:column;justify-content:center;padding:clamp(28px,5vw,88px);color:#f6f4ef;background:#134e4a}.login-eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 24px}.login-visual h1{font-size:clamp(42px,5vw,76px);font-weight:800;letter-spacing:-.04em;margin:0 0 24px}.login-description{font-size:17px;line-height:1.6;max-width:32ch;margin:0}.login-panel{padding:48px 56px}.login-card{max-width:508px}.login-card h2{font-size:30px;margin:0 0 8px}.login-intro{font-size:14px;line-height:1.6;color:var(--muted);margin:0 0 28px}.login-card .field{margin-bottom:20px}.login-card input{min-height:48px;padding:12px}.login-card .primary{min-height:48px;padding:12px 28px}.login-help{font-size:13px;line-height:1.6;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:28px}.login input:focus-visible,.login button:focus-visible{outline:3px solid #59b9ac;outline-offset:3px}
    @media(max-width:820px){.login-visual{padding:26px 20px;min-height:0}.login-eyebrow{margin-bottom:12px}.login-visual h1{font-size:34px;margin-bottom:12px}.login-description{font-size:13px;max-width:40ch}.login-panel{padding:32px 20px 48px}.login-card{max-width:none}.login-card input{font-size:16px}.login-card .primary{width:100%}}
    @media print{body{background:#fff}.no-print{display:none!important}.report{box-shadow:none;margin:0;max-width:none;padding:0}}
    .login{background:#f2f2f2;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);min-height:100svh}.login-visual{position:relative;overflow:hidden;min-height:100svh;padding:0;background:#500400;display:block;color:#fff}.login-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.login-eyebrow{position:absolute;top:7%;left:7.3%;font-size:14px;font-weight:700;letter-spacing:.1em;z-index:1}.login-eyebrow:before{content:'';display:block;width:26px;border-top:2px solid #edb2a5;margin-bottom:15px}.login-title{position:absolute;left:7.3%;top:35%;right:3%;z-index:1}.login-visual h1{font-size:clamp(42px,5.4vw,88px);line-height:.99;letter-spacing:-.045em;margin:0 0 22px;font-weight:800}.login-description{font-size:18px;line-height:1.4;max-width:none;margin:0 0 0 4px}.login-footer{position:absolute;bottom:0;left:7.1%;right:6%;border-top:1px solid #eee;padding-top:16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;z-index:1}.login-panel{padding:48px 56px;justify-content:flex-start}.login-card{max-width:508px;width:100%}.login-tabs{display:inline-flex;margin-bottom:28px;border:1px solid #999}.login-tabs button{border:0;border-radius:0;background:transparent;min-height:34px;padding:8px 13px;font-size:12px;color:#111}.login-tabs .selected{background:#fa310d;color:#fff}.login-card h2{font-size:30px;letter-spacing:-.035em;margin:0 0 8px}.login-intro{font-size:14px;line-height:1.4;margin:0 0 28px}.login-card label{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px;margin-bottom:7px}.login-card input{border:1px solid #999;border-radius:0;background:#eae8e8;min-height:36px;padding:8px 11px;font-size:14px}.login-card .field{margin-bottom:18px}.login-actions{display:flex;align-items:center;gap:16px;margin-top:32px}.login-card .primary{background:#fa310d;border-color:#fa310d;border-radius:0;min-height:36px;padding:8px 15px;font-size:14px;font-weight:700}.login-link{border:0;padding:8px 0;background:transparent;color:#ef300e;font-size:14px;font-weight:700}.login input:focus-visible,.login button:focus-visible{outline:2px solid #d33116;outline-offset:3px}.login-access{font-size:15px;line-height:1.6;margin-bottom:24px}.login button:disabled{opacity:.6;cursor:wait}
    @media(max-width:820px){.login{grid-template-columns:1fr}.login-visual{min-height:300px}.login-art{object-position:center}.login-eyebrow{top:24px;left:24px;font-size:10px}.login-title{top:100px;left:24px}.login-visual h1{font-size:44px;margin-bottom:14px}.login-description{font-size:13px;max-width:30ch;margin-left:0}.login-footer{display:none}.login-panel{padding:32px 24px 48px}.login-card{max-width:none}.login-card input{font-size:16px;min-height:44px}.login-card .primary{min-height:44px}.login-actions .primary{width:auto}.desktop-break{display:none}}
  </style>
</head>
<body>
  <div id="app"><main class="wrap"><p>Carregando sistema...</p></main></div>
  <script src="./app.js"></script>
</body>
</html>
